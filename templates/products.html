{% extends "base.html" %}

{% block title %}
Mahsulotlar sahifasi
{% endblock %}

{% block content %}

<div class="max-w-7xl mx-auto px-6 py-10">

    <h1 class="text-4xl font-bold mb-10 text-center text-zinc-800">
        Mahsulotlar
    </h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">

        {% for product in products %}

        <div class="bg-white rounded-2xl shadow-lg overflow-hidden hover:scale-105 transition duration-300">

            <!-- IMAGE -->
            <div class="h-60 overflow-hidden">
                <img
                    src="{{ product.image.url }}"
                    alt="{{ product.name }}"
                    class="w-full h-full object-cover"
                >
            </div>

            <!-- BODY -->
            <div class="p-5">

                <h2 class="text-xl font-bold text-zinc-800 mb-2">
                    {{ product.name }}
                </h2>

                <p class="text-gray-500 text-sm mb-4">
                    {{ product.description|truncatewords:10 }}
                </p>

                <div class="flex items-center justify-between">

                    <span class="text-cyan-500 font-bold text-xl">
                        ${{ product.price }}
                    </span>

                    <a href="{% url 'product_detail' product.id %}"
                       class="bg-cyan-500 text-white px-4 py-2 rounded-lg hover:bg-cyan-600 transition">
                        Ko‘rish
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
